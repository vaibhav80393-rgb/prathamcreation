<title>Flappy Vaibhav</title>
<style>
html,body{margin:0;background:#111;font-family:Arial,sans-serif;color:white;height:100%}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(430px,100vw);background:#78c8ff;border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;text-shadow:0 2px 3px #345}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0004}
.card{background:#fffffff2;color:#111;padding:24px;border-radius:18px;text-align:center;width:270px}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:10px;margin:8px 0;font-size:16px}
button{border:0;border-radius:10px;padding:12px 20px;font-weight:800;cursor:pointer;font-size:16px}
</style>

<body>
<div id="wrap">
<canvas id="game" width="360" height="640"></canvas>
<div id="hud"><span id="nameHud">PLAYER</span><span>⭐ <b id="score">0</b> | BEST <b id="best">0</b></span></div>
<div id="panel"><div class="card">
<h2 id="title">FLAPPY VAIBHAV</h2>
<p id="msg">Enter your name and fly through the pipes!</p>
<input id="name" maxlength="16" placeholder="Your name">
<button id="start">START GAME</button>
<p style="font-size:12px;color:#666">Click / Space = flap</p>
</div></div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),W=c.width,H=c.height;
const panel=document.getElementById("panel"),start=document.getElementById("start"),nameInput=document.getElementById("name");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),nameHud=document.getElementById("nameHud");
let bird,pipes,score=0,best=0,running=false,last=0;

function reset(){
  bird={x:82,y:290,vy:0,r:14}; pipes=[]; score=0; scoreEl.textContent=0;
  nameHud.textContent=(nameInput.value.trim()||"PLAYER").toUpperCase();
  running=true; panel.style.display="none"; last=performance.now(); requestAnimationFrame(loop);
}
function flap(){if(!running){reset();return} bird.vy=-330}
function addPipe(){
  const difficulty=Math.min(score/40,1);
  const gap=160-difficulty*35;
  const top=75+Math.random()*(H-80-gap-150);
  pipes.push({x:W+20,w:58,top,gap,passed:false});
}
function collision(p){
 return bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap);
}
function gameOver(){
 running=false; best=Math.max(best,score); bestEl.textContent=best;
 document.getElementById("title").textContent="GAME OVER";
 document.getElementById("msg").textContent="Score: "+score+" • Best: "+best;
 nameInput.style.display="none"; start.textContent="PLAY AGAIN"; panel.style.display="flex";
}
function draw(){
 x.clearRect(0,0,W,H);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#79cfff");g.addColorStop(.72,"#dff7ff");g.addColorStop(.72,"#9bd36a");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle="#fff9";[[55,100,35],[245,145,42],[150,55,28]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2]*.45,0,7);x.arc(a[0]+a[2]*.45,a[1]+3,a[2]*.55,0,7);x.arc(a[0]+a[2],a[1],a[2]*.4,0,7);x.fill()});
 for(const p of pipes){x.fillStyle="#4caf45";x.fillRect(p.x,0,p.w,p.top);x.fillRect(p.x,p.top+p.gap,p.w,H-80-(p.top+p.gap));x.fillStyle="#36863a";x.fillRect(p.x-5,p.top-14,p.w+10,14);x.fillRect(p.x-5,p.top+p.gap,p.w+10,14)}
 x.fillStyle="#d9b45c";x.fillRect(0,H-80,W,80);x.fillStyle="#76b84b";for(let i=0;i<W;i+=22)x.fillRect(i,H-80,12,5);
 x.save();x.translate(bird.x,bird.y);x.rotate(Math.max(-.5,Math.min(1,bird.vy/600)));x.fillStyle="#ffd43b";x.beginPath();x.arc(0,0,bird.r,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(7,-6,6,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(9,-6,2,0,7);x.fill();x.fillStyle="#f28c28";x.beginPath();x.moveTo(13,0);x.lineTo(27,5);x.lineTo(13,8);x.fill();x.restore();
}
function loop(t){
 if(!running)return;
 const dt=Math.min(.033,(t-last)/1000);last=t;
 const difficulty=Math.min(score/40,1);
 bird.vy+=(1050+difficulty*250)*dt;bird.y+=bird.vy*dt;
 const speed=145+difficulty*65;
 if(!pipes.length||pipes[pipes.length-1].x<190)addPipe();
 for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score}}
 pipes=pipes.filter(p=>p.x+p.w>-10);
 if(bird.y-bird.r<0||bird.y+bird.r>H-80||pipes.some(collision)){draw();gameOver();return}
 draw();requestAnimationFrame(loop);
}
start.onclick=()=>{if(nameInput.value.trim()||nameInput.style.display==="none")reset();else{nameInput.focus();}};
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();flap()}});
c.addEventListener("pointerdown",flap);draw();
</script>
